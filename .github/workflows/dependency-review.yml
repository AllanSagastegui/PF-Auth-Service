name: "Security • Dependency Review"

run-name: "Security • PR #${{ github.event.pull_request.number }} • Dependencies"

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  dependency-review:
    name: "Review Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Dependency Graph Support
        id: dependency-graph
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.get({ owner, repo });
            const status = data.security_and_analysis?.dependency_graph?.status ?? 'disabled';

            core.setOutput('status', status);

            if (status !== 'enabled') {
              core.notice(`Skipping dependency review because Dependency graph is ${status} for ${owner}/${repo}.`);
            }

      - name: Review Dependency Changes
        if: steps.dependency-graph.outputs.status == 'enabled'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
